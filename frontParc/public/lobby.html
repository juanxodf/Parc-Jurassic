<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jurassic Park — Lobby</title>
  <link rel="icon" href="/vite.svg" type="image/svg+xml" />
</head>
<body>
  <nav class="navbar">
    <span class="navbar-brand">🦕 Jurassic Park</span>
    <div class="navbar-user">
      <span id="navbar-user-name">—</span>
      <span class="role-badge" id="navbar-user-role">—</span>
      <a href="/gameUI.html">Mapa</a>
      <button id="logout-btn" class="btn-ghost btn-sm">Salir</button>
    </div>
  </nav>

  <div class="page-container">
    <div class="page-header">
      <h1>Panel de operaciones</h1>
    </div>

    <!-- Resumen -->
    <div class="grid-3 mb-6">
      <div class="card text-center">
        <div class="stat-card-value text-primary" id="resumen-celdas">—</div>
        <div class="stat-card-label">Celdas totales</div>
      </div>
      <div class="card text-center">
        <div class="stat-card-value text-primary" id="resumen-dinos">—</div>
        <div class="stat-card-label">Dinosaurios</div>
      </div>
      <div class="card text-center">
        <div class="stat-card-value text-warning" id="resumen-avisos">—</div>
        <div class="stat-card-label">Alertas activas</div>
      </div>
    </div>

    <div class="grid-2">
      <!-- Mis tareas -->
      <div>
        <p class="section-title">Mis tareas</p>
        <div id="mis-tareas-list">
          <p class="loader">Cargando...</p>
        </div>
      </div>

      <!-- Alertas de peligro -->
      <div>
        <p class="section-title">⚠ Dinosaurios de alto riesgo</p>
        <div class="card">
          <div id="dino-peligro-list">
            <p class="loader">Cargando...</p>
          </div>
        </div>

        <div class="mt-5">
          <p class="section-title">Acceso rápido</p>
          <div class="flex-row">
            <a href="/gameUI.html"><button class="btn-primary">Ver mapa de celdas</button></a>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
