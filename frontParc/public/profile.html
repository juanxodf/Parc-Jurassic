<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jurassic Park — Mi Perfil</title>
</head>
<body>
  <nav class="navbar">
    <span class="navbar-brand">🦕 Jurassic Park</span>
    <div class="navbar-user">
      <span id="navbar-user-name">—</span>
      <span class="role-badge" id="navbar-user-role">—</span>
      <a href="/lobby.html">Lobby</a>
      <button id="logout-btn" class="btn-ghost" style="padding:4px 12px;font-size:12px">Salir</button>
    </div>
  </nav>

  <div class="page-container" style="max-width:600px">
    <div class="page-header">
      <h1>Mi Perfil</h1>
    </div>

    <div class="card" style="margin-bottom:24px;display:flex;align-items:center;gap:20px">
      <img id="profile-photo"
           src=""
           alt="Foto de perfil"
           style="display:none;width:80px;height:80px;border-radius:50%;object-fit:cover;border:2px solid var(--color-primary)" />
      <div style="width:80px;height:80px;border-radius:50%;background:var(--color-border);
                  display:flex;align-items:center;justify-content:center;font-size:28px;flex-shrink:0">🦖</div>
      <div>
        <div style="font-size:18px;font-weight:bold;color:var(--color-primary)" id="profile-nick">—</div>
        <div style="font-size:12px;color:var(--color-muted)" id="profile-role">—</div>
      </div>
    </div>

    <div class="card">
      <form id="profile-form" enctype="multipart/form-data">
        <div class="form-group">
          <label>Nombre</label>
          <input type="text" id="profile-name" name="name" placeholder="Tu nombre completo" />
        </div>

        <div class="form-group">
          <label>Email</label>
          <input type="email" id="profile-email" name="email" disabled
                 style="opacity:0.5;cursor:not-allowed" />
        </div>

        <div class="form-group">
          <label>Foto de perfil</label>
          <input type="file" id="photo-input" name="photo" accept="image/jpg,image/jpeg,image/png,image/webp" />
          <img id="photo-preview" src="" alt="Vista previa"
               style="display:none;margin-top:10px;width:80px;height:80px;border-radius:50%;object-fit:cover;border:2px solid var(--color-border)" />
        </div>

        <hr style="border-color:var(--color-border);margin:20px 0" />

        <p style="font-size:12px;color:var(--color-muted);margin-bottom:12px">
          Deja estos campos vacíos si no quieres cambiar la contraseña
        </p>

        <div class="form-group">
          <label>Nueva contraseña</label>
          <input type="password" name="password" placeholder="Mínimo 8 caracteres" />
        </div>

        <div class="form-group">
          <label>Confirmar nueva contraseña</label>
          <input type="password" name="password_confirmation" placeholder="Repite la contraseña" />
        </div>

        <button type="submit" class="btn-primary" style="width:100%">Guardar cambios</button>
      </form>
    </div>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
