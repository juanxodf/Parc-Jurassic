<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jurassic Park — Mi Perfil</title>
</head>
<body>
  <nav class="navbar">
    <span class="navbar-brand">🦕 Jurassic Park</span>
    <div class="navbar-user">
      <span id="navbar-user-name">—</span>
      <span class="role-badge" id="navbar-user-role">—</span>
      <a href="/lobby.html">Lobby</a>
      <button id="logout-btn" class="btn-ghost btn-sm">Salir</button>
    </div>
  </nav>

  <div class="page-container page-container-sm">
    <div class="page-header">
      <h1>Mi Perfil</h1>
    </div>

    <div class="card profile-header mb-6">
      <img id="profile-photo"
           src=""
           alt="Foto de perfil"
           class="profile-avatar rounded-full object-cover border-primary hidden" />
      <div id="profile-avatar-placeholder" class="profile-avatar-placeholder rounded-full">🦖</div>
      <div>
        <div class="text-lg font-bold text-primary" id="profile-nick">—</div>
        <div class="text-muted" id="profile-role">—</div>
      </div>
    </div>

    <div class="card">
      <form id="profile-form" enctype="multipart/form-data">
        <div class="form-group">
          <label>Nombre</label>
          <input type="text" id="profile-name" name="name" placeholder="Tu nombre completo" />
        </div>

        <div class="form-group">
          <label>Email</label>
          <input type="email" id="profile-email" name="email" disabled
                 class="opacity-50 cursor-disabled" />
        </div>

        <div class="form-group">
          <label>Foto de perfil</label>
          <input type="file" id="photo-input" name="photo" accept="image/jpg,image/jpeg,image/png,image/webp" />
          <img id="photo-preview" src="" alt="Vista previa"
               class="profile-preview rounded-full object-cover border-soft hidden mt-2" />
        </div>

        <hr class="mt-5 mb-5" />

        <p class="text-muted mb-3">
          Deja estos campos vacíos si no quieres cambiar la contraseña
        </p>

        <div class="form-group">
          <label>Nueva contraseña</label>
          <input type="password" name="password" placeholder="Mínimo 8 caracteres" />
        </div>

        <div class="form-group">
          <label>Confirmar nueva contraseña</label>
          <input type="password" name="password_confirmation" placeholder="Repite la contraseña" />
        </div>

        <button type="submit" class="btn-primary btn-block">Guardar cambios</button>
      </form>
    </div>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
